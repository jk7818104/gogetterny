name: Security tests

on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main

jobs:
  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/gg_test
